openapi: 3.0.3
info:
  title: Banco Solidario Puntos API
  version: 0.1.0
  description: |
    Contrato del API que consumen el sitio del participante, el panel de administración y la app móvil.
    GENERADO desde la MockAPI (`npm run api:docs`): no editar a mano. Los cuerpos y respuestas de cada
    endpoint están en src/app/core/models.ts y en los handlers de src/app/core/mock-api/.
    Convenciones: JSON, errores `{ "message": string }` con el código HTTP (401 sin sesión, 403 sin permiso, 409 conflicto, 422 validación).
servers:
  - url: /api
    description: Misma ruta base que `environment.apiBase`
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Slide: {"type":"object","properties":{"id":{"type":"string"},"imagen":{"type":"string"},"imagenMovil":{"type":"string"},"alt":{"type":"string"},"to":{"type":"string"}},"required":["id","imagen","alt"]}
    Subcategoria: {"type":"object","properties":{"slug":{"type":"string"},"label":{"type":"string"}},"required":["slug","label"]}
    CategoriaProducto: {"type":"object","properties":{"slug":{"type":"string"},"label":{"type":"string"},"icon":{"type":"string"},"imagen":{"type":"string"},"subcategorias":{"type":"array","items":{"type":"object","properties":{"slug":{"type":"string"},"label":{"type":"string"}},"required":["slug","label"]}}},"required":["slug","label","icon","subcategorias"]}
    Beneficio: {"type":"object","properties":{"id":{"type":"string"},"marca":{"type":"string"},"marcaUrl":{"type":"string"},"nombre":{"type":"string"},"descuento":{"type":"string"},"categoria":{"type":"string"},"categoriaSlug":{"type":"string"},"imagen":{"type":"string"},"galeria":{"type":"array","items":{"type":"string"}},"descripcion":{"type":"string"},"pasos":{"type":"array","items":{"type":"string"}},"especificaciones":{"type":"array","items":{"type":"string"}},"terminos":{"type":"string"},"tipo":{"type":"string","enum":["cupon","compra"]},"puntos":{"type":"number"},"precio":{"type":"number"},"soloDinero":{"type":"boolean"},"puntosOriginal":{"type":"number"},"precioOriginal":{"type":"number"},"promoEtiqueta":{"type":"string"},"etiqueta":{"type":"string"},"etiquetaColor":{"type":"string"}},"required":["id","marca","marcaUrl","nombre","descuento","categoria","categoriaSlug","imagen","galeria","descripcion","pasos","especificaciones","terminos","tipo"]}
    Direccion: {"type":"object","properties":{"id":{"type":"string"},"alias":{"type":"string"},"recibe":{"type":"string"},"telefono":{"type":"string"},"direccion":{"type":"string"},"distrito":{"type":"string"},"provincia":{"type":"string"},"lat":{"type":"number"},"lng":{"type":"number"}},"required":["id","alias","recibe","telefono","direccion","distrito"]}
    NavItem: {"type":"object","properties":{"label":{"type":"string"},"to":{"type":"string"},"children":{"type":"array","items":{"type":"object","properties":{"label":{"type":"string"},"to":{"type":"string"}},"required":["label"]}}},"required":["label"]}
    Nivel: {"type":"object","properties":{"id":{"type":"string","enum":["clasico","plata","oro","diamante"]},"nombre":{"type":"string"},"desde":{"type":"number"},"hasta":{"oneOf":[{"nullable":true},{"type":"number"}]},"color":{"type":"string"},"beneficios":{"type":"array","items":{"type":"string"}}},"required":["id","nombre","desde","hasta","color","beneficios"]}
    NivelId: {"type":"string","enum":["clasico","plata","oro","diamante"]}
    Ciudad: {"type":"object","properties":{"codigo":{"type":"string"},"ciudad":{"type":"string"},"pais":{"type":"string"}},"required":["codigo","ciudad","pais"]}
    Destino: {"type":"object","properties":{"slug":{"type":"string"},"ciudad":{"type":"string"},"pais":{"type":"string"},"codigo":{"type":"string"},"imagen":{"type":"string"},"titulo":{"type":"string"},"resumen":{"type":"string"},"desdeUSD":{"type":"number"},"duracion":{"type":"string"},"mejorEpoca":{"type":"string"},"descripcion":{"type":"string"},"highlights":{"type":"array","items":{"type":"string"}}},"required":["slug","ciudad","pais","codigo","imagen","titulo","resumen","desdeUSD","duracion","mejorEpoca","descripcion","highlights"]}
    Cotizacion: {"type":"object","properties":{"codigo":{"type":"string"},"fecha":{"type":"string"},"origen":{"type":"string"},"destino":{"type":"string"},"tipoViaje":{"type":"string"},"clase":{"type":"string"},"pasajeros":{"type":"number"},"pasajerosDetalle":{"type":"array","items":{"type":"object","properties":{"nombres":{"type":"string"},"apellidos":{"type":"string"},"tipoDoc":{"type":"string"},"numDoc":{"type":"string"},"nacimiento":{"type":"string"},"asistencia":{"type":"boolean"}},"required":["nombres","apellidos","tipoDoc","numDoc","nacimiento","asistencia"]}},"salida":{"type":"string"},"regreso":{"type":"string"},"estado":{"type":"string","enum":["Enviada","En revisión","Cotizada","Cerrada"]},"ejecutiva":{"type":"string"},"ejecutivaId":{"type":"string"},"monto":{"type":"number"},"pdf":{"type":"string"},"pdfUrl":{"type":"string"},"nota":{"type":"string"},"contactos":{"type":"array","items":{"type":"object","properties":{"canal":{"type":"string"},"por":{"type":"string"},"fecha":{"type":"string"}},"required":["canal","por","fecha"]}},"mensajes":{"type":"array","items":{"type":"object","properties":{"de":{"type":"string","enum":["Ejecutiva","Participante"]},"autor":{"type":"string"},"texto":{"type":"string"},"fecha":{"type":"string"},"adjunto":{"type":"string"}},"required":["de","autor","texto","fecha"]}},"historial":{"type":"array","items":{"type":"object","properties":{"estado":{"type":"string","enum":["Enviada","En revisión","Cotizada","Cerrada"]},"fecha":{"type":"string"},"por":{"type":"string"}},"required":["estado","fecha","por"]}}},"required":["codigo","fecha","origen","destino","tipoViaje","clase","pasajeros","pasajerosDetalle","salida","estado","mensajes","historial"]}
    PasajeroCotizacion: {"type":"object","properties":{"nombres":{"type":"string"},"apellidos":{"type":"string"},"tipoDoc":{"type":"string"},"numDoc":{"type":"string"},"nacimiento":{"type":"string"},"asistencia":{"type":"boolean"}},"required":["nombres","apellidos","tipoDoc","numDoc","nacimiento","asistencia"]}
    MensajeCotizacion: {"type":"object","properties":{"de":{"type":"string","enum":["Ejecutiva","Participante"]},"autor":{"type":"string"},"texto":{"type":"string"},"fecha":{"type":"string"},"adjunto":{"type":"string"}},"required":["de","autor","texto","fecha"]}
    EstadoCotizacion: {"type":"string","enum":["Enviada","En revisión","Cotizada","Cerrada"]}
    EstadoBeneficio: {"type":"string","enum":["activo","usado","vencido"]}
    BeneficioUsuario: {"type":"object","properties":{"id":{"type":"string"},"beneficioId":{"type":"string"},"codigo":{"type":"string"},"estado":{"type":"string","enum":["activo","usado","vencido"]},"fecha":{"type":"string"},"vence":{"type":"string"}},"required":["id","beneficioId","codigo","estado","fecha","vence"]}
    Compra: {"type":"object","properties":{"codigo":{"type":"string"},"fecha":{"type":"string"},"fechaISO":{"type":"string"},"estado":{"type":"string","enum":["Entregado","En camino","Procesando"]},"entrega":{"type":"string"},"puntosUsados":{"type":"number"},"montoUSD":{"type":"number"},"items":{"type":"array","items":{"type":"object","properties":{"nombre":{"type":"string"},"marca":{"type":"string"},"imagen":{"type":"string"},"cantidad":{"type":"number"},"puntos":{"type":"number"}},"required":["nombre","marca","imagen","cantidad","puntos"]}}},"required":["codigo","fecha","fechaISO","estado","entrega","puntosUsados","montoUSD","items"]}
    CompraItem: {"type":"object","properties":{"nombre":{"type":"string"},"marca":{"type":"string"},"imagen":{"type":"string"},"cantidad":{"type":"number"},"puntos":{"type":"number"}},"required":["nombre","marca","imagen","cantidad","puntos"]}
    TipoMovimiento: {"type":"string","enum":["compra","acumulacion","canje","vencimiento","ajuste"]}
    Movimiento: {"type":"object","properties":{"id":{"type":"string"},"fechaISO":{"type":"string"},"fecha":{"type":"string"},"detalle":{"type":"string"},"tipo":{"type":"string","enum":["compra","acumulacion","canje","vencimiento","ajuste"]},"puntos":{"type":"number"}},"required":["id","fechaISO","fecha","detalle","tipo","puntos"]}
    TarjetaBanbif: {"type":"object","properties":{"id":{"type":"string"},"label":{"type":"string"}},"required":["id","label"]}
    Participante: {"type":"object","properties":{"id":{"type":"string"},"nombre":{"type":"string"},"cedula":{"type":"string"},"email":{"type":"string"},"celular":{"type":"string"},"puntos":{"type":"number"},"acumulados12m":{"type":"number"},"estado":{"type":"string","enum":["Activo","Bloqueado"]},"canal":{"type":"string","enum":["Web","App","Web + App"]},"alta":{"type":"string"},"recibeNovedades":{"type":"boolean"},"novedadesCambio":{"type":"object","properties":{"fecha":{"type":"string"},"origen":{"type":"string","enum":["participante","enlace","admin"]}},"required":["fecha","origen"]}},"required":["id","nombre","cedula","email","celular","puntos","acumulados12m","estado","canal","alta"]}
    EstadoPedido: {"type":"string","enum":["Entregado","Confirmado","Preparando","Enviado","Digital enviado","Cancelado"]}
    Mensaje: {"type":"object","properties":{"id":{"type":"string"},"nombre":{"type":"string"},"email":{"type":"string"},"asunto":{"type":"string"},"mensaje":{"type":"string"},"fecha":{"type":"string"},"estado":{"type":"string","enum":["Nuevo","En proceso","Respondido"]},"telefono":{"type":"string"},"origen":{"type":"string"}},"required":["id","nombre","email","asunto","mensaje","fecha","estado"]}
    RolAdmin: {"type":"string","enum":["Administrador","Catálogo","Operaciones","Atención","Solo lectura"]}
    TipoCampo: {"type":"string","enum":["texto","email","telefono","numero","fecha","textarea","select","checkbox"]}
    CampoForm: {"type":"object","properties":{"id":{"type":"string"},"tipo":{"type":"string","enum":["texto","email","telefono","numero","fecha","textarea","select","checkbox"]},"etiqueta":{"type":"string"},"obligatorio":{"type":"boolean"},"ayuda":{"type":"string"},"opciones":{"type":"array","items":{"type":"string"}},"mapeo":{"type":"string"},"ancho":{"type":"string","enum":["media","completa"]}},"required":["id","tipo","etiqueta","obligatorio","ancho"]}
    Producto: {"type":"object","properties":{"id":{"type":"string"},"marca":{"type":"string"},"marcaUrl":{"type":"string"},"nombre":{"type":"string"},"puntos":{"type":"number"},"precio":{"type":"number"},"imagen":{"type":"string"},"galeria":{"type":"array","items":{"type":"string"}},"categoria":{"type":"string"},"categoriaLabel":{"type":"string"},"subcategoria":{"type":"string"},"subcategoriaLabel":{"type":"string"},"descripcion":{"type":"string"},"digital":{"type":"boolean"},"consideraciones":{"type":"array","items":{"type":"string"}},"especificaciones":{"type":"array","items":{"type":"string"}},"puntosOriginal":{"type":"number"},"precioOriginal":{"type":"number"},"promoEtiqueta":{"type":"string"},"etiqueta":{"type":"string"},"etiquetaColor":{"type":"string"},"stock":{"type":"number"},"destacado":{"type":"boolean"}},"required":["id","marca","marcaUrl","nombre","puntos","precio","imagen","galeria","categoria","categoriaLabel","subcategoria","subcategoriaLabel","descripcion","digital","consideraciones","especificaciones"]}
    MenuItem: {"type":"object","properties":{"id":{"type":"string"},"label":{"type":"string"},"to":{"type":"string"},"activo":{"type":"boolean"},"children":{"type":"array","items":{"type":"object","properties":{"label":{"type":"string"},"to":{"type":"string"},"activo":{"type":"boolean"}},"required":["label","to","activo"]}}},"required":["label","activo"]}
    SeccionHome: {"type":"object","properties":{"id":{"type":"string"},"s":{"type":"string"},"on":{"type":"boolean"}},"required":["id","s","on"]}
    Reglas: {"type":"object","properties":{"porDolar":{"type":"number"},"precio":{"type":"number"},"min":{"type":"number"},"max":{"type":"number"},"mensual":{"type":"number"},"paquetes":{"type":"array","items":{"type":"number"}},"compraActiva":{"type":"boolean"},"soloDinero":{"type":"boolean"},"vigenciaMeses":{"type":"number"},"avisoVencimientoDias":{"type":"number"},"version":{"type":"number"}},"required":["porDolar","precio","min","max","mensual","paquetes","compraActiva","soloDinero"]}
    ContenidoSeccion: {"type":"object","properties":{"t":{"type":"string"},"p":{"type":"array","items":{"type":"string"}}},"required":["t","p"]}
    ContenidoFaq: {"type":"object","properties":{"q":{"type":"string"},"a":{"type":"string"}},"required":["q","a"]}
    CartItem: {"type":"object","properties":{"id":{"type":"string"},"tipo":{"type":"string","enum":["producto","beneficio"]},"nombre":{"type":"string"},"marca":{"type":"string"},"imagen":{"type":"string"},"puntos":{"type":"number"},"precio":{"type":"number"},"cantidad":{"type":"number"},"digital":{"type":"boolean"},"soloDinero":{"type":"boolean"}},"required":["id","tipo","nombre","marca","imagen","puntos","precio","cantidad","digital"]}
    Cupon: {"type":"object","properties":{"codigo":{"type":"string"},"expira":{"type":"number"}},"required":["codigo","expira"]}
    Notificacion: {"type":"object","properties":{"id":{"type":"string"},"tipo":{"type":"string","enum":["beneficio","pedido","puntos","vuelo","cuenta","info"]},"titulo":{"type":"string"},"texto":{"type":"string"},"enlace":{"type":"string"},"fecha":{"type":"string"},"leida":{"type":"boolean"}},"required":["id","tipo","titulo","texto","fecha","leida"]}
    Orden: {"type":"object","properties":{"codigo":{"type":"string"},"items":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"tipo":{"type":"string","enum":["producto","beneficio"]},"nombre":{"type":"string"},"marca":{"type":"string"},"imagen":{"type":"string"},"puntos":{"type":"number"},"precio":{"type":"number"},"cantidad":{"type":"number"},"digital":{"type":"boolean"},"soloDinero":{"type":"boolean"}},"required":["id","tipo","nombre","marca","imagen","puntos","precio","cantidad","digital"]}},"puntosUsados":{"type":"number"},"montoUSD":{"type":"number"},"entrega":{"type":"string"},"fecha":{"type":"string"}},"required":["codigo","items","puntosUsados","montoUSD","entrega","fecha"]}
    Usuario: {"type":"object","properties":{"nombre":{"type":"string"},"nivel":{"type":"string"},"puntosNivel":{"type":"number"},"puntos":{"type":"number"}},"required":["nombre","nivel","puntosNivel","puntos"]}
    Perfil: {"type":"object","properties":{"tipoDocumento":{"type":"string"},"codigoParticipante":{"type":"string"},"correo":{"type":"string"},"nombres":{"type":"string"},"apellidos":{"type":"string"},"telefono":{"type":"string"},"extra":{"type":"object","additionalProperties":{"oneOf":[{"type":"string"},{"type":"boolean"},{"type":"boolean"}]}}},"required":["tipoDocumento","codigoParticipante","correo","nombres","apellidos","telefono"]}
    Categoria: {"type":"object","properties":{"slug":{"type":"string"},"label":{"type":"string"},"icon":{"type":"string"},"imagen":{"type":"string"},"subcategorias":{"type":"array","items":{"type":"object","properties":{"slug":{"type":"string"},"label":{"type":"string"}},"required":["slug","label"]}}},"required":["slug","label","icon"]}
    Orden_Producto: {"type":"string","enum":["recomendado","puntos-asc","puntos-desc","az"]}
    Paginado:
      type: object
      description: Respuesta de las listas paginadas del panel (admin/q/{col}).
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        facetas: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer } } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  "/admin/q/{col}":
    get:
      tags: ["admin-colecciones"]
      summary: "Lista paginada: ?page=1&size=25&q=texto&sort=campo&dir=asc|desc&f_campo=valor&desde=YYYY-MM-DD&hasta=YYYY-MM-DD"
      operationId: "get_admin_q_col"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
        - { name: "page", in: query, required: false, schema: { type: integer } }
        - { name: "size", in: query, required: false, schema: { type: integer } }
        - { name: "q", in: query, required: false, schema: { type: string } }
        - { name: "sort", in: query, required: false, schema: { type: string } }
        - { name: "dir", in: query, required: false, schema: { type: string } }
        - { name: "desde", in: query, required: false, schema: { type: string } }
        - { name: "hasta", in: query, required: false, schema: { type: string } }
        - { name: "facetas", in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Paginado" }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/c/{col}/{key}":
    get:
      tags: ["admin-colecciones"]
      summary: "Un elemento por clave (id, codigo o slug)."
      operationId: "get_admin_c_col_key"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
        - { name: "key", in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
    put:
      tags: ["admin-colecciones"]
      summary: "Crea o reemplaza un elemento sin enviar la colección completa."
      operationId: "put_admin_c_col_key"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
        - { name: "key", in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["admin-colecciones"]
      summary: "DELETE admin/c/:col/:key"
      operationId: "delete_admin_c_col_key"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
        - { name: "key", in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/c/{col}/bulk":
    post:
      tags: ["admin-colecciones"]
      summary: "Alta masiva (carga de archivos)."
      operationId: "post_admin_c_col_bulk"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/c/{col}":
    get:
      tags: ["admin-colecciones"]
      summary: "GET admin/c/:col"
      operationId: "get_admin_c_col"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
    put:
      tags: ["admin-colecciones"]
      summary: "PUT admin/c/:col"
      operationId: "put_admin_c_col"
      security: [{ bearer: [] }]
      parameters:
        - { name: "col", in: path, required: true, schema: { type: string, enum: ["participantes", "pedidos", "mensajes", "usuarios", "auditoria", "productos", "beneficios", "destinos", "ciudades", "categoriasProducto", "categoriasBeneficio", "banners", "bannersVuelos", "onboarding", "campos", "lotes", "seccionesHome", "marcas", "comprasPuntos", "plantillasCorreo", "correosEnviados", "campanas", "importaciones"] } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/config":
    put:
      tags: ["admin-config"]
      summary: "Mezcla claves de configuración pública (sitio, contenido, menú, cupón, promociones…)."
      operationId: "put_admin_config"
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/participantes/{id}/actividad":
    get:
      tags: ["admin-participantes"]
      summary: "GET admin/participantes/:id/actividad"
      operationId: "get_admin_participantes_id_actividad"
      security: [{ bearer: [] }]
      parameters:
        - { name: "id", in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/participantes/{id}/codigo":
    post:
      tags: ["admin-participantes"]
      summary: "El participante ingresa con un código enviado a su correo: soporte puede pedir uno nuevo (queda en auditoría)."
      operationId: "post_admin_participantes_id_codigo"
      security: [{ bearer: [] }]
      parameters:
        - { name: "id", in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "4XX": { $ref: "#/components/responses/Error" }
  "/admin/participantes/{id}/correo":
    post:
      tags: ["admin-participantes"]
      summary: "Cambia el correo al que llegan los códigos de acceso: valida el formato y que no lo use otra persona; queda en auditoría."
      operationId: "post_admin_participantes_id_correo"
      security: [{ bearer: [] }]
      parameters:
        - { name: "id", in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
